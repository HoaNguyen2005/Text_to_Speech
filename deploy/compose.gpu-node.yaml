name: tts-gpu-node

services:
  omnivoice:
    image: text2speech-omnivoice:0.2.1-cu128
    build:
      context: ../engine/omnivoice_service
      args:
        TORCH_BUILD: cu128
    init: true
    restart: unless-stopped
    gpus: all
    env_file:
      - path: ./engine.gpu.env
        format: raw
    environment:
      OMNIVOICE_DEVICE: cuda
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    volumes:
      - ../backend/data/book-audio:/app/backend/data/book-audio
      - gpu-omnivoice-cache:/home/tts/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8002/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 25m

  vieneu:
    image: text2speech-vieneu:3.8.3-gpu
    build:
      context: ../engine/vieneu_service
      dockerfile: Dockerfile.gpu
    init: true
    restart: unless-stopped
    gpus: all
    env_file:
      - path: ./engine.gpu.env
        format: raw
    environment:
      VIENEU_DEVICE: cuda
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
      HF_HUB_ETAG_TIMEOUT: '60'
    volumes:
      - ../backend/data/book-audio:/app/backend/data/book-audio
      - gpu-vieneu-cache:/home/tts/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15m
    stop_grace_period: 25m

  engine:
    image: text2speech-engine:gpu-cu128
    build:
      context: ../engine
      dockerfile: Dockerfile.gpu
    init: true
    restart: unless-stopped
    gpus: all
    env_file:
      - path: ./engine.gpu.env
        format: raw
    environment:
      VIENEU_URL: http://vieneu:8001
      OMNIVOICE_URL: http://omnivoice:8002
      OPENVOICE_WATERMARK: '0'
      ENGINE_NODE_ROLE: gpu
      TUNNEL_METRICS_URL: http://tunnel:2000/metrics
      REMOTE_BACKEND_URLS: https://text2speech-backend.onrender.com
    ports:
      - "8000:8000"
    volumes:
      - ../backend/data/book-audio:/app/backend/data/book-audio
      - ../backend/public/audio:/app/backend/public/audio
      - ../engine/checkpoints/converter:/app/engine/checkpoints/converter
      - gpu-engine-cache:/home/tts/.cache
      - gpu-engine-processed:/app/engine/processed
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 25m

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://engine:8000"]
    depends_on:
      engine:
        condition: service_healthy

volumes:
  gpu-omnivoice-cache:
  gpu-vieneu-cache:
  gpu-engine-cache:
  gpu-engine-processed:

